<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Reader & Annotator</title>
  
  <!-- PDF.js Styles & Script -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f4f6f8; color: #333; }
    
    #toolbar { 
      background: #ffffff; 
      padding: 12px 18px; 
      border-radius: 8px; 
      margin-bottom: 15px; 
      display: flex; 
      gap: 15px; 
      align-items: center; 
      flex-wrap: wrap; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); 
    }

    button, select, input[type="file"] {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button { background: #0066cc; color: white; border: none; cursor: pointer; }
    button:hover { background: #0052a3; }

    #pdf-wrapper { position: relative; display: inline-block; border: 1px solid #ddd; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    /* PDF Text Layer (Enables Mouse Selection) */
    .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; opacity: 0.2; line-height: 1.0; }
    
    /* Annotation Layer Overlay */
    .annotation-layer { position: absolute; left: 0; top: 0; pointer-events: none; width: 100%; height: 100%; }
    
    .highlight { position: absolute; background-color: rgba(255, 235, 59, 0.5); pointer-events: auto; cursor: pointer; }
    .underline { position: absolute; border-bottom: 3px solid #e53935; pointer-events: auto; cursor: pointer; }
    
    /* Hover Tooltip for Comments */
    .highlight:hover::after, .underline:hover::after {
      content: attr(data-comment);
      position: absolute;
      bottom: 100%;
      left: 0;
      background: #222;
      color: #fff;
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <label><strong>Upload PDF:</strong> <input type="file" id="pdf-upload" accept="application/pdf" /></label>
    
    <label><strong>My Saved Books:</strong> 
      <select id="book-selector">
        <option value="">-- Select Saved Book --</option>
      </select>
    </label>

    <button id="prev">Previous</button>
    <span>Page: <span id="page-num">1</span> / <span id="page-count">--</span></span>
    <button id="next">Next</button>

    <label><strong>Mode:</strong>
      <select id="mode">
        <option value="highlight">Highlight Text</option>
        <option value="underline">Underline Text</option>
      </select>
    </label>
  </div>

  <div id="pdf-wrapper">
    <canvas id="pdf-canvas"></canvas>
    <div id="text-layer" class="textLayer"></div>
    <div id="annotation-layer" class="annotation-layer"></div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = "https://tqxcuvpxzpgwrfqobnur.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxeGN1dnB4enBnd3JmcW9ibnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjUwMzEsImV4cCI6MjEwMjgwMTAzMX0.1MB-7R4MwVOXdOIgsDWkTei1L7O9XPBMSQ0_VT9Eu2s";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let currentBookId = "";
    const currentUserId = "demo-user";

    // Initial Load: Fetch saved books
    fetchSavedBooks();

    // 1. Handle Local File Upload to Supabase Storage
    document.getElementById('pdf-upload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      currentBookId = file.name.replace(/[^a-zA-Z0-9]/g, "_");

      // Upload file blob directly to public bucket
      const { error } = await supabaseClient.storage
        .from('pdf-files')
        .upload(`${currentUserId}/${currentBookId}.pdf`, file, { upsert: true });

      if (error) {
        console.error("Storage upload error:", error);
      }

      await fetchSavedBooks();
      document.getElementById('book-selector').value = currentBookId;
      loadPDFFromStorage(currentBookId);
    });

    // 2. Select Saved Book from Dropdown
    document.getElementById('book-selector').addEventListener('change', (e) => {
      if (e.target.value) {
        currentBookId = e.target.value;
        loadPDFFromStorage(currentBookId);
      }
    });

    // List all files in the user's storage bucket folder
    async function fetchSavedBooks() {
      const { data: files, error } = await supabaseClient.storage.from('pdf-files').list(currentUserId);
      const selector = document.getElementById('book-selector');
      selector.innerHTML = '<option value="">-- Select Saved Book --</option>';

      if (files) {
        files.forEach(file => {
          if (file.name.endsWith('.pdf')) {
            const bookId = file.name.replace('.pdf', '');
            const opt = document.createElement('option');
            opt.value = bookId;
            opt.textContent = file.name;
            selector.appendChild(opt);
          }
        });
      }
    }

    // Download raw PDF bytes using Public URL
    async function loadPDFFromStorage(bookId) {
      const { data: publicUrlData } = supabaseClient.storage
        .from('pdf-files')
        .getPublicUrl(`${currentUserId}/${bookId}.pdf`);

      try {
        const response = await fetch(publicUrlData.publicUrl);
        if (!response.ok) throw new Error("Could not fetch file");

        const arrayBuffer = await response.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument(arrayBuffer).promise;
        document.getElementById('page-count').textContent = pdfDoc.numPages;

        // Load reading progress
        const { data: progress } = await supabaseClient
          .from('progress')
          .select('last_viewed_page')
          .eq('user_id', currentUserId)
          .eq('book_id', bookId)
          .single();

        pageNum = progress ? progress.last_viewed_page : 1;
        renderPage(pageNum);
      } catch (err) {
        console.error("Download Error:", err);
        alert("Error loading PDF. Ensure bucket is set to 'Public' in Supabase Storage.");
      }
    }

    async function renderPage(num) {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });

      const canvas = document.getElementById('pdf-canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const wrapper = document.getElementById('pdf-wrapper');
      wrapper.style.width = `${viewport.width}px`;
      wrapper.style.height = `${viewport.height}px`;

      // Render Canvas
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      document.getElementById('page-num').textContent = num;

      // Render Interactive Text Layer
      const textLayerDiv = document.getElementById('text-layer');
      textLayerDiv.innerHTML = '';
      textLayerDiv.style.width = `${viewport.width}px`;
      textLayerDiv.style.height = `${viewport.height}px`;

      const textContent = await page.getTextContent();
      pdfjsLib.renderTextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport: viewport,
        textDivs: []
      });

      // Update page progress
      if (currentBookId) {
        await supabaseClient.from('progress').upsert({
          user_id: currentUserId,
          book_id: currentBookId,
          last_viewed_page: num
        }, { onConflict: 'user_id,book_id' });
      }

      loadAnnotations(num);
    }

    // Capture Text Selection, Prompt for Comment, and Save
    document.getElementById('pdf-wrapper').addEventListener('mouseup', async () => {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      const wrapperRect = document.getElementById('pdf-wrapper').getBoundingClientRect();

      const userComment = prompt("Add a comment/note for this text (optional):") || "";

      const annotation = {
        x: rect.left - wrapperRect.left,
        y: rect.top - wrapperRect.top,
        w: rect.width,
        h: rect.height
      };

      const type = document.getElementById('mode').value;

      drawAnnotationBox(annotation, type, userComment);

      // Save to database
      await supabaseClient.from('annotations').insert({
        book_id: currentBookId,
        user_id: currentUserId,
        page_number: pageNum,
        annotation_type: type,
        rects: annotation,
        comment_text: userComment
      });

      selection.removeAllRanges();
    });

    function drawAnnotationBox(rect, type, commentText) {
      const layer = document.getElementById('annotation-layer');
      const box = document.createElement('div');
      box.className = type;
      box.style.left = `${rect.x}px`;
      box.style.top = `${rect.y}px`;
      box.style.width = `${rect.w}px`;
      box.style.height = `${rect.h}px`;

      if (commentText) {
        box.setAttribute('data-comment', commentText);
      }

      layer.appendChild(box);
    }

    async function loadAnnotations(num) {
      const layer = document.getElementById('annotation-layer');
      layer.innerHTML = '';

      const { data: items } = await supabaseClient
        .from('annotations')
        .select('*')
        .eq('book_id', currentBookId)
        .eq('page_number', num);

      if (items) {
        items.forEach(item => drawAnnotationBox(item.rects, item.annotation_type, item.comment_text));
      }
    }

    // Controls
    document.getElementById('prev').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      renderPage(pageNum);
    });

    document.getElementById('next').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      renderPage(pageNum);
    });
  </script>
</body>
</html>
