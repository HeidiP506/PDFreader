<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Reader & Annotator</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f4f6f8; color: #333; }

    button, select, input[type="file"] {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button { background: #0066cc; color: white; border: none; cursor: pointer; }
    button:hover { background: #0052a3; }
    button.danger { background: #d9534f; }
    button.danger:hover { background: #c9302c; }

    #main-container { display: flex; gap: 20px; align-items: flex-start; }

    #pdf-wrapper { position: relative; display: inline-block; border: 1px solid #ddd; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; opacity: 0.2; line-height: 1.0; }
    .annotation-layer { position: absolute; left: 0; top: 0; pointer-events: none; width: 100%; height: 100%; z-index: 10; }
    
    .highlight { position: absolute; background-color: rgba(255, 235, 59, 0.5); pointer-events: auto; cursor: pointer; }
    .underline { position: absolute; border-bottom: 3px solid #e53935; pointer-events: auto; cursor: pointer; }

    #sidebar {
      width: 280px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      max-height: 80vh;
      overflow-y: auto;
    }

    .annotation-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .annotation-card p { margin: 0 0 8px 0; font-size: 13px; }
    .annotation-card .actions { display: flex; gap: 8px; }
    .annotation-card button { padding: 3px 8px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Dynamic File Explorer Container -->
  <div id="file-explorer"></div>

  <div id="main-container">
    <div id="pdf-wrapper">
      <canvas id="pdf-canvas"></canvas>
      <div id="text-layer" class="textLayer"></div>
      <div id="annotation-layer" class="annotation-layer"></div>
    </div>

    <div id="sidebar">
      <h3>Page Annotations</h3>
      <div id="annotation-list">No annotations on this page.</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
